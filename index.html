<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b111c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>בינגו הצוערים</title>
<meta name="description" content="בינגו יומי לקורס הצוערים לשלטון מקומי">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0b111c;
    --night-2: #121b2a;
    --navy: #1a2a44;
    --navy-hi: #22385a;
    --ivory: #fbf7ee;
    --ivory-2: #f1e9d8;
    --ink: #17233a;
    --gold: #c9a55a;
    --gold-hi: #f0d692;
    --gold-lo: #94722f;
    --muted: #8b97ab;
    --hair: rgba(201,165,90,.28);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: "Heebo", system-ui, sans-serif;
    color: var(--ivory);
    background:
      radial-gradient(90% 45% at 50% 0%, #1d2b44 0%, transparent 70%),
      radial-gradient(70% 40% at 50% 100%, #141f31 0%, transparent 70%),
      var(--night);
    min-height: 100vh; min-height: 100dvh;
    padding: max(14px, env(safe-area-inset-top)) 12px max(18px, env(safe-area-inset-bottom));
    display: flex; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 520px; display: flex; flex-direction: column; }

  /* ---------- כותרת ---------- */
  header { text-align: center; padding: 4px 0 12px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 11.5px; letter-spacing: 2.5px; font-weight: 600; color: var(--gold);
  }
  .eyebrow::before, .eyebrow::after { content: ""; width: 26px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .eyebrow::after { transform: scaleX(-1); }
  h1 {
    font-family: "Frank Ruhl Libre", serif; font-weight: 900;
    font-size: clamp(34px, 10vw, 48px); line-height: 1; margin: 8px 0 6px;
    background: linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 60%, var(--gold-lo) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: -.5px;
  }
  .date { font-size: 14px; color: var(--muted); }
  .date b { color: var(--ivory); font-weight: 500; }

  /* ---------- רצועת נתונים ---------- */
  .strip {
    display: grid; grid-template-columns: 1fr 1fr 1.35fr;
    border: 1px solid var(--hair); border-radius: 16px;
    background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.01));
    margin-bottom: 12px; overflow: hidden;
  }
  .strip > div { padding: 9px 8px 8px; text-align: center; position: relative; }
  .strip > div + div::before {
    content: ""; position: absolute; right: 0; top: 22%; bottom: 22%; width: 1px; background: var(--hair);
  }
  .strip .v { font-family: "Frank Ruhl Libre", serif; font-weight: 700; font-size: 24px; line-height: 1.05; color: var(--gold-hi); }
  .strip .k { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .strip .rank { font-size: 15px; font-weight: 700; color: var(--gold-hi); line-height: 1.6; white-space: nowrap; }
  .rankbar { height: 3px; border-radius: 3px; background: rgba(255,255,255,.08); margin: 4px 10px 0; overflow: hidden; }
  .rankbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold-lo), var(--gold-hi)); transition: width .5s ease; }

  /* ---------- שורת סטטוס ---------- */
  .status {
    height: 34px; display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 15.5px; font-weight: 600; color: var(--ivory);
  }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px rgba(201,165,90,.18); }
  .status.is-hot { color: var(--gold-hi); }
  .status.is-hot .dot { animation: pulse 1.2s ease-in-out infinite; }
  .status.is-win { color: var(--gold-hi); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(201,165,90,.05); } }

  /* ---------- לוח ---------- */
  .frame {
    position: relative;
    padding: 2px; border-radius: 22px;
    background: linear-gradient(150deg, var(--gold-hi), var(--gold-lo) 35%, var(--gold) 65%, var(--gold-lo));
    box-shadow: 0 22px 60px rgba(0,0,0,.5), 0 2px 0 rgba(255,255,255,.04) inset;
  }
  .board {
    display: grid; gap: 6px;
    background: linear-gradient(180deg, #0f1726, #0b111c);
    padding: 8px; border-radius: 20px;
  }
  .cell {
    position: relative;
    aspect-ratio: 1 / 1;
    border: none; border-radius: 12px;
    background: linear-gradient(180deg, var(--ivory) 0%, var(--ivory-2) 100%);
    color: var(--ink);
    font-family: "Heebo", sans-serif; font-weight: 700; line-height: 1.16;
    padding: 9px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    cursor: pointer; user-select: none; -webkit-user-select: none;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 -2px 0 rgba(23,35,58,.07) inset, 0 3px 8px rgba(0,0,0,.25);
    transition: transform .14s ease, background .25s ease, color .25s ease, box-shadow .25s ease;
  }
  .cell span { display: block; width: 100%; overflow-wrap: normal; word-break: keep-all; position: relative; z-index: 1; }
  .cell:active { transform: scale(.94); }

  /* מסומן: כחול עמוק, טקסט שנהב, חותמת זהב */
  .cell.marked {
    background: radial-gradient(130% 110% at 30% 15%, var(--navy-hi) 0%, var(--navy) 55%, #142139 100%);
    color: var(--ivory);
    box-shadow: 0 0 0 1px rgba(201,165,90,.45) inset, 0 3px 8px rgba(0,0,0,.35);
  }
  .cell.marked::before {
    content: ""; position: absolute; top: 4px; left: 4px; width: 12px; height: 12px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--gold-hi), var(--gold) 55%, var(--gold-lo));
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  .cell.marked::after {
    content: ""; position: absolute; top: 6.5px; left: 8.3px; width: 2.6px; height: 5px;
    border: solid var(--night); border-width: 0 1.6px 1.6px 0; transform: rotate(45deg);
  }

  /* משבצת שחסרה לבינגו */
  .cell.near:not(.marked) { box-shadow: 0 0 0 2px var(--gold) inset, 0 0 16px rgba(201,165,90,.35), 0 3px 8px rgba(0,0,0,.25); }

  /* משבצת בשורה שהושלמה: זהב */
  .cell.line {
    background: radial-gradient(130% 110% at 30% 15%, #f6e2a6 0%, var(--gold) 50%, var(--gold-lo) 100%);
    color: #1d1505;
    box-shadow: 0 0 0 1px rgba(255,244,210,.7) inset, 0 4px 14px rgba(201,165,90,.35);
  }
  .cell.line::before { background: var(--night); box-shadow: none; }
  .cell.line::after { border-color: var(--gold-hi); }
  .cell.sweep { animation: sweep .6s ease both; }
  @keyframes sweep { 0% { transform: scale(1); } 40% { transform: scale(1.07); } 100% { transform: scale(1); } }

  .cell.free {
    background: radial-gradient(circle at 50% 40%, var(--navy-hi), var(--night-2));
    color: var(--gold-hi); cursor: default;
    font-family: "Frank Ruhl Libre", serif; font-weight: 700;
    box-shadow: 0 0 0 1px var(--hair) inset;
  }
  .cell.free::before, .cell.free::after { content: none; }
  .cell.stamp { animation: stamp .3s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes stamp { 0% { transform: scale(.86); } 100% { transform: scale(1); } }

  /* הסבר ראשוני */
  .intro {
    position: absolute; inset: 0; z-index: 5; border-radius: 22px;
    background: rgba(8,12,20,.82); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 24px;
  }
  .intro[hidden] { display: none; }
  .intro h3 { font-family: "Frank Ruhl Libre", serif; font-size: 26px; margin: 0 0 12px; color: var(--gold-hi); }
  .intro p { margin: 0 0 6px; font-size: 16px; line-height: 1.55; max-width: 290px; }
  .intro .go {
    margin-top: 16px; font: 700 17px "Heebo", sans-serif; color: var(--night);
    background: linear-gradient(180deg, var(--gold-hi), var(--gold)); border: none; border-radius: 14px;
    padding: 13px 40px; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }

  /* ---------- תחתית ---------- */
  .foot { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 14px; }
  .ghost {
    font: 500 14.5px "Heebo", sans-serif; color: var(--muted);
    background: transparent; border: 1px solid transparent; border-radius: 10px;
    padding: 9px 12px; cursor: pointer;
  }
  .ghost:active { color: var(--ivory); border-color: var(--hair); }
  .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--hair); }
  .seg { display: none; border: 1px solid var(--hair); border-radius: 10px; overflow: hidden; margin-inline-start: 6px; }
  .seg.show { display: flex; }
  .seg button { font: 500 14px "Heebo", sans-serif; background: transparent; color: var(--muted); border: none; padding: 8px 11px; cursor: pointer; }
  .seg button.on { background: var(--gold); color: var(--night); font-weight: 700; }

  /* ---------- חלון ניצחון ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 20; background: rgba(5,8,14,.74);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .overlay.show { display: flex; }
  .win {
    width: 100%; max-width: 340px; text-align: center;
    background: linear-gradient(180deg, #1b2a42, var(--night));
    border: 1px solid var(--gold); border-radius: 24px; padding: 28px 22px 20px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 5px rgba(201,165,90,.1);
    animation: pop .42s cubic-bezier(.2, 1.5, .4, 1);
  }
  .seal {
    width: 78px; height: 78px; margin: 0 auto 14px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 30%, var(--gold-hi), var(--gold) 50%, var(--gold-lo));
    color: var(--night); font-family: "Frank Ruhl Libre", serif; font-size: 36px; font-weight: 900;
    box-shadow: 0 0 0 6px rgba(201,165,90,.18), 0 10px 26px rgba(0,0,0,.45);
  }
  .win h2 {
    font-family: "Frank Ruhl Libre", serif; font-weight: 900; font-size: 48px; margin: 0; line-height: 1.05;
    background: linear-gradient(180deg, var(--gold-hi), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .win p { font-size: 16.5px; line-height: 1.55; margin: 10px 0 20px; }
  .win .row { display: flex; gap: 8px; }
  .win button { flex: 1; font: 700 16px "Heebo", sans-serif; border-radius: 14px; padding: 13px 8px; cursor: pointer; }
  .win .primary { background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: var(--night); border: none; }
  .win .second { background: transparent; color: var(--ivory); border: 1px solid var(--hair); }
  @keyframes pop { from { transform: scale(.72); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; }

  .toast {
    position: fixed; bottom: max(22px, env(safe-area-inset-bottom)); left: 50%;
    transform: translate(-50%, 30px); opacity: 0;
    background: var(--ivory); color: var(--ink); font-weight: 600; font-size: 15px;
    padding: 10px 18px; border-radius: 999px; box-shadow: 0 10px 30px rgba(0,0,0,.4);
    transition: all .3s ease; z-index: 25; white-space: nowrap;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .preview-tag { display: none; text-align: center; font-size: 13px; color: var(--night); background: var(--gold); border-radius: 8px; padding: 4px 10px; margin: 0 auto 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">קורס הצוערים לשלטון מקומי</div>
    <h1>בינגו הצוערים</h1>
    <div class="date" id="date"></div>
  </header>
  <div class="preview-tag" id="previewTag">תצוגה מקדימה של טיוטה</div>

  <div class="strip">
    <div><div class="v" id="streak">0</div><div class="k">ימים ברצף</div></div>
    <div><div class="v" id="total">0</div><div class="k">בינגו סה"כ</div></div>
    <div><div class="rank" id="rank">התנסות ראשונה</div><div class="rankbar"><i id="rankbar"></i></div><div class="k" id="rankNext">דרגה</div></div>
  </div>

  <div class="status" id="status"><span class="dot"></span><span id="statusText"></span></div>

  <div class="frame">
    <div id="board" class="board" role="grid" aria-label="כרטיס בינגו"></div>
    <div class="intro" id="intro" hidden>
      <h3>איך משחקים</h3>
      <p>שומעים בכיתה משפט שמופיע בכרטיס? לוחצים עליו.</p>
      <p>שורה, עמודה או אלכסון מלאים - בינגו.</p>
      <p style="color:var(--muted);font-size:14px">כל בוקר מחכה כרטיס חדש.</p>
      <button class="go" id="introGo">יאללה</button>
    </div>
  </div>

  <div class="foot">
    <button class="ghost" id="newCard">כרטיס חדש</button>
    <span class="sep"></span>
    <button class="ghost" id="clearMarks">ניקוי סימונים</button>
    <div class="seg" id="seg"><button id="size4">4×4</button><button id="size5">5×5</button></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="win">
    <div class="seal">ב</div>
    <h2 id="winTitle">בינגו!</h2>
    <p id="winText"></p>
    <div class="row">
      <button class="primary" id="closeWin">ממשיכים</button>
      <button class="second" id="share">שיתוף</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>

<script src="phrases.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);

  // תצוגה מקדימה מעמוד העריכה: משפטים מהטיוטה, בלי לגעת בהתקדמות האמיתית
  const PREVIEW = new URLSearchParams(location.search).has("preview");
  const STORE = PREVIEW ? "cadet-bingo-preview" : "cadet-bingo-v2";
  if (PREVIEW) {
    try {
      const draft = JSON.parse(localStorage.getItem("cadet-bingo-draft"));
      if (Array.isArray(draft) && draft.length) PHRASES = draft;
    } catch (e) {}
    localStorage.removeItem("cadet-bingo-preview");
    $("previewTag").style.display = "table";
  }

  const FREE = "חופשי";
  const RANKS = [[0, "התנסות ראשונה"], [3, "רפרנטורה"], [8, "ניהול אגף"], [15, "מנכ\"לות"], [25, "ראשות הרשות"]];
  const boardEl = $("board");

  const todayKey = () => { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };
  const dayDiff = (a, b) => {
    const p = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
    return Math.round((p(b) - p(a)) / 86400000);
  };
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const UNIQUE = [...new Set(PHRASES)];
  const canFive = UNIQUE.length >= 24;

  function newCard(size) {
    const needFree = size % 2 === 1;
    const count = size * size - (needFree ? 1 : 0);
    const picked = shuffle(UNIQUE).slice(0, count);
    while (picked.length < count) picked.push("-");
    const mid = Math.floor((size * size) / 2), cells = [];
    let k = 0;
    for (let i = 0; i < size * size; i++) {
      if (needFree && i === mid) cells.push({ t: FREE, m: true, free: true });
      else cells.push({ t: picked[k++], m: false });
    }
    return { size, cells, seen: [], full: false, day: todayKey() };
  }

  const load = () => { try { return JSON.parse(localStorage.getItem(STORE)); } catch (e) { return null; } };
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} };

  let S = load() || { stats: { total: 0, streak: 0, lastPlayed: null }, card: null, size: 4 };
  if (!S.stats) S.stats = { total: 0, streak: 0, lastPlayed: null };
  if (!canFive) S.size = 4;
  let freshDay = false;
  if (!S.card || S.card.day !== todayKey()) { freshDay = !!S.card; S.card = newCard(S.size || 4); }
  // המאגר השתנה, או שהלוח גדול מדי למאגר - כרטיס חדש
  if (S.card.cells.some(c => !c.free && !UNIQUE.includes(c.t)) || (!canFive && S.card.size === 5)) S.card = newCard(S.size || 4);
  if (S.stats.lastPlayed && dayDiff(S.stats.lastPlayed, todayKey()) > 1) S.stats.streak = 0;

  function lines(size) {
    const L = [], r = [...Array(size).keys()];
    r.forEach(i => L.push({ id: "r" + i, idx: r.map(c => i * size + c) }));
    r.forEach(c => L.push({ id: "c" + c, idx: r.map(i => i * size + c) }));
    L.push({ id: "d1", idx: r.map(i => i * size + i) });
    L.push({ id: "d2", idx: r.map(i => i * size + (size - 1 - i)) });
    return L;
  }

  const glue = t => t.replace(/"(?=\S)/g, '"⁠').replace(/(\S)"/g, '$1⁠"');

  // הגופן הגדול ביותר שנכנס במשבצת
  function fitSize(el, base, min) {
    const sp = el.firstChild; let s = base;
    sp.style.fontSize = s + "px";
    while (s > min && (sp.scrollHeight > el.clientHeight - 18 || sp.scrollWidth > sp.clientWidth + 1)) { s -= 0.5; sp.style.fontSize = s + "px"; }
    return s;
  }

  function analyse() {
    const { size, cells } = S.card;
    const all = lines(size);
    const done = all.filter(l => l.idx.every(i => cells[i].m));
    const open = all.filter(l => !l.idx.every(i => cells[i].m));
    const need = open.length ? Math.min(...open.map(l => l.idx.filter(i => !cells[i].m).length)) : 0;
    const near = new Set();
    open.forEach(l => { const miss = l.idx.filter(i => !cells[i].m); if (miss.length === 1) near.add(miss[0]); });
    return { done, need, near, inLine: new Set(done.flatMap(l => l.idx)) };
  }

  function render(opts = {}) {
    const { size, cells } = S.card;
    const a = analyse();
    boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
    boardEl.innerHTML = "";
    const cellW = (boardEl.clientWidth - 16 - 6 * (size - 1)) / size;
    const base = Math.min(size === 4 ? 19 : 15.5, Math.max(12, cellW * (size === 4 ? 0.205 : 0.215)));
    const els = [];
    cells.forEach((c, i) => {
      const b = document.createElement("button");
      let cls = "cell";
      if (c.free) cls += " free";
      else if (a.inLine.has(i)) cls += " marked line";
      else if (c.m) cls += " marked";
      if (a.near.has(i)) cls += " near";
      if (i === opts.stamp) cls += " stamp";
      if (opts.sweep && opts.sweep.has(i)) cls += " sweep";
      b.className = cls;
      b.setAttribute("aria-pressed", c.m ? "true" : "false");
      const sp = document.createElement("span"); sp.textContent = glue(c.t); b.appendChild(sp);
      if (!c.free) b.addEventListener("click", () => toggle(i));
      boardEl.appendChild(b); els.push(b);
    });
    // טיפוגרפיה אחידה: כולם באותו גודל, חוץ ממשפטים שחייבים קטן יותר
    const fits = els.map((el, i) => fitSize(el, cells[i].free ? base + 2 : base, 10.5));
    const floor = size === 4 ? 14 : 12;
    const uniform = Math.max(Math.min(...fits.filter((_, i) => !cells[i].free)), floor);
    els.forEach((el, i) => {
      const s = cells[i].free ? fits[i] : Math.min(fits[i], uniform);
      el.firstChild.style.fontSize = s + "px";
      if (el.firstChild.scrollWidth > el.firstChild.clientWidth + 1) el.firstChild.style.overflowWrap = "anywhere";
    });
    renderStatus(a);
    renderStats();
    $("size4").classList.toggle("on", size === 4);
    $("size5").classList.toggle("on", size === 5);
    return a;
  }

  function renderStatus(a) {
    const st = $("status"), tx = $("statusText");
    const marked = S.card.cells.filter(c => c.m && !c.free).length;
    st.className = "status";
    if (S.card.cells.every(c => c.m)) { st.classList.add("is-win"); tx.textContent = "כרטיס מלא. אין יותר מה ללמד אותך"; }
    else if (a.done.length) { st.classList.add("is-win"); tx.textContent = a.done.length === 1 ? "בינגו! עוד שורה?" : `${a.done.length} שורות היום`; }
    else if (a.need === 1) { st.classList.add("is-hot"); tx.textContent = "משבצת אחת מבינגו"; }
    else if (marked === 0) tx.textContent = "לוחצים על משפט כשהוא נאמר";
    else tx.textContent = `עוד ${a.need} משבצות לבינגו`;
  }

  const rankOf = n => { let r = RANKS[0][1]; RANKS.forEach(([min, name]) => { if (n >= min) r = name; }); return r; };
  const rankIdx = n => { let k = 0; RANKS.forEach(([min], i) => { if (n >= min) k = i; }); return k; };

  function renderStats() {
    const t = S.stats.total, k = rankIdx(t);
    $("streak").textContent = S.stats.streak;
    $("total").textContent = t;
    $("rank").textContent = RANKS[k][1];
    const next = RANKS[k + 1];
    if (next) {
      const from = RANKS[k][0];
      $("rankbar").style.width = ((t - from) / (next[0] - from) * 100) + "%";
      $("rankNext").textContent = `עוד ${next[0] - t} ל${next[1]}`;
    } else { $("rankbar").style.width = "100%"; $("rankNext").textContent = "הדרגה הגבוהה ביותר"; }
  }

  function markPlayedToday() {
    const t = todayKey();
    if (S.stats.lastPlayed === t) return;
    const gap = S.stats.lastPlayed ? dayDiff(S.stats.lastPlayed, t) : null;
    S.stats.streak = gap === 1 ? S.stats.streak + 1 : 1;
    S.stats.lastPlayed = t;
    if (S.stats.streak > 1) toast(`${S.stats.streak} ימים ברצף. ככה בונים קריירה`);
  }

  function toggle(i) {
    const c = S.card.cells[i];
    c.m = !c.m;
    if (c.m) { markPlayedToday(); if (navigator.vibrate) navigator.vibrate(12); }
    const a0 = analyse();
    const ids = new Set(a0.done.map(l => l.id));
    S.card.seen = S.card.seen.filter(id => ids.has(id));
    const fresh = a0.done.filter(l => !S.card.seen.includes(l.id));
    fresh.forEach(l => S.card.seen.push(l.id));
    const before = rankOf(S.stats.total);
    S.stats.total += fresh.length;
    const after = rankOf(S.stats.total);
    render({ stamp: c.m ? i : -1, sweep: new Set(fresh.flatMap(l => l.idx)) });
    const all = S.card.cells.every(x => x.m);
    if (all && !S.card.full) {
      S.card.full = true;
      setTimeout(() => celebrate("כרטיס מלא!", "סימנת את כל הכרטיס. אין יותר מה ללמד אותך."), 350);
    } else if (fresh.length) {
      const n = a0.done.length;
      let txt = n === 1 ? "השלמת שורה. עכשיו לצעוק בקול." : `כבר ${n} שורות היום. מישהו פה מקשיב טוב מדי.`;
      if (after !== before) txt = `עלית בדרגה: ${after}.`;
      setTimeout(() => celebrate("בינגו!", txt), 350);
    }
    if (!all) S.card.full = false;
    save();
  }

  let lastWin = "";
  function celebrate(title, text) {
    lastWin = title;
    $("winTitle").textContent = title; $("winText").textContent = text;
    $("overlay").classList.add("show");
    confetti();
    if (navigator.vibrate) navigator.vibrate([60, 40, 120]);
  }
  const closeWin = () => $("overlay").classList.remove("show");
  $("closeWin").onclick = closeWin;
  $("overlay").onclick = e => { if (e.target.id === "overlay") closeWin(); };

  $("share").onclick = async () => {
    const lines = analyse().done.length;
    const url = location.origin + location.pathname;
    const text = `${lastWin === "כרטיס מלא!" ? "סגרתי כרטיס מלא" : "קיבלתי בינגו"} בבינגו הצוערים (${lines} ${lines === 1 ? "שורה" : "שורות"} היום, דרגה: ${rankOf(S.stats.total)}). מי הבא?`;
    try {
      if (navigator.share) { await navigator.share({ title: "בינגו הצוערים", text, url }); return; }
      await navigator.clipboard.writeText(text + "\n" + url); toast("ההודעה הועתקה, אפשר להדביק בקבוצה");
    } catch (e) {}
  };

  let tt;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 2600); }

  const hasProgress = () => S.card.cells.some(c => c.m && !c.free);
  const ask = msg => !hasProgress() || window.confirm(msg);

  $("newCard").onclick = () => { if (!ask("לערבב כרטיס חדש? הסימונים של היום יימחקו.")) return; S.card = newCard(S.card.size); save(); render(); toast("כרטיס חדש מוכן"); };
  $("clearMarks").onclick = () => {
    if (!hasProgress()) { toast("אין סימונים לנקות"); return; }
    if (!ask("לנקות את כל הסימונים?")) return;
    S.card.cells.forEach(c => { if (!c.free) c.m = false; }); S.card.seen = []; S.card.full = false; save(); render();
  };
  function setSize(n) { if (S.card.size === n) return; if (!ask("החלפת גודל יוצרת כרטיס חדש. להמשיך?")) return; S.size = n; S.card = newCard(n); save(); render(); }
  if (canFive) $("seg").classList.add("show");
  $("size4").onclick = () => setSize(4);
  $("size5").onclick = () => setSize(5);

  // הסבר ראשוני - פעם אחת
  const INTRO = "cadet-bingo-intro";
  try { if (!localStorage.getItem(INTRO) && !PREVIEW) $("intro").hidden = false; } catch (e) {}
  $("introGo").onclick = () => { $("intro").hidden = true; try { localStorage.setItem(INTRO, "1"); } catch (e) {} };

  const d = new Date();
  $("date").innerHTML = "<b>" + d.toLocaleDateString("he-IL", { weekday: "long" }) + "</b> · " + d.toLocaleDateString("he-IL", { day: "numeric", month: "long" });

  // קונפטי בגווני זהב
  const cv = $("confetti"), ctx = cv.getContext("2d");
  let parts = [], raf = null;
  function confetti() {
    cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    const colors = ["#f0d692", "#c9a55a", "#94722f", "#fbf7ee", "#fff3cf"];
    for (let i = 0; i < 170; i++) parts.push({
      x: innerWidth / 2 + (Math.random() - .5) * 60, y: innerHeight * .35,
      vx: (Math.random() - .5) * 13, vy: -6 - Math.random() * 9,
      w: 5 + Math.random() * 6, h: 7 + Math.random() * 9, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
      c: colors[i % colors.length]
    });
    if (!raf) tick();
  }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(p => {
      p.vy += .28; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2))); ctx.restore();
    });
    parts = parts.filter(p => p.y < innerHeight + 40);
    raf = parts.length ? requestAnimationFrame(tick) : (ctx.clearRect(0, 0, innerWidth, innerHeight), null);
  }

  let rt;
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => render(), 150); });
  const start = () => { render(); save(); if (freshDay) toast("כרטיס חדש ליום חדש"); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
})();
</script>
</body>
